name: Integrate Calamosca legal fallback

on:
  push:
    branches:
      - foundation/concierge-content-model
    paths:
      - scripts/integrate-calamosca-fallback.py
      - .github/workflows/integrate-calamosca-fallback.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/integrate-calamosca-fallback.py
      - name: Commit generated fallback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/restaurants js/photos.js PHOTO_CREDITS.md docs/RESTAURANT_PHOTO_RIGHTS.md
          git diff --cached --quiet || git commit -m "Integrate legal Calamosca context fallback"
          git push
