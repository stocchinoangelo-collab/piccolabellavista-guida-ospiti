name: QA guida ospiti

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - design/boutique-mediterraneo

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Node regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: ''

      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          for f in js/*.js sw.js tests/*.cjs; do
            node --check "$f"
          done

      - name: Rendering and asset verification
        run: node tests/verify.cjs

      - name: Release regression suite
        run: node tests/release.cjs

      - name: Startup simulation
        run: node tests/startup.cjs

      - name: Offline/cache simulation
        run: node tests/offline.cjs

      - name: HTTP path verification
        run: node tests/http.cjs
