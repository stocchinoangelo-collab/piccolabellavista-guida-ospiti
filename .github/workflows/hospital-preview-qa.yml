name: Hospital stays browser QA
on:
  push:
    branches: [feature/soggiorni-ospedali]
  pull_request:
    branches: [main]
    paths:
      - js/**
      - tests/hospitals-browser.cjs
      - .github/workflows/hospital-preview-qa.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Browser verification
        run: |
          node scripts/serve.cjs &
          node tests/hospitals-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hospital-stays-browser-results
          path: artifacts/
