name: Generate concierge beaches

on:
  push:
    branches:
      - foundation/concierge-content-model
    paths:
      - 'js/data.js'
      - 'scripts/migrate-beaches.mjs'
      - '.github/workflows/generate-concierge-beaches.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: foundation/concierge-content-model

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate dataset
        run: node scripts/migrate-beaches.mjs

      - name: Validate generated JSON
        run: |
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('data/concierge/beaches.generated.json','utf8')); if(!Array.isArray(d)||!d.length) process.exit(1); const ids=d.map(x=>x.id); if(new Set(ids).size!==ids.length) process.exit(2); console.log('records',d.length);"

      - name: Commit generated dataset
        run: |
          if git diff --quiet -- data/concierge/beaches.generated.json; then
            echo 'No generated changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/concierge/beaches.generated.json
          git commit -m 'Generate concierge beach dataset'
          git push
