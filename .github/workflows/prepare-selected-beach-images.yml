name: Prepare selected beach images

on:
  workflow_dispatch:
  push:
    branches:
      - foundation/concierge-content-model
    paths:
      - scripts/prepare-selected-beach-images.py
      - .github/workflows/prepare-selected-beach-images.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundation/concierge-content-model
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/prepare-selected-beach-images.py
      - name: Commit generated beach images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/beaches
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Generate selected beach image assets"
            git push
          fi
